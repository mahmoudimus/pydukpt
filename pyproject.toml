[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pydukpt"
dynamic = ["version"]
description = "ANSI X9.24-1 TDES DUKPT key derivation and ISO 9564 PIN blocks, with a dukpt 1.0.1 compatible API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mahmoud Abdelkader", email = "mabdelkader@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["pycryptodome>=3.10"]
keywords = ["dukpt", "x9.24", "ansi", "tdes", "pin", "pinblock", "iso9564", "payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
lint = ["ruff==0.17.0"]

[project.urls]
Homepage = "https://github.com/mahmoudimus/pydukpt"
Source = "https://github.com/mahmoudimus/pydukpt"
Issues = "https://github.com/mahmoudimus/pydukpt/issues"
Changelog = "https://github.com/mahmoudimus/pydukpt/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pydukpt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydukpt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pydukpt",
    "tests",
    "tools",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: walks all 2**20 - 1 device KSNs (a few seconds)"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "helpers"]

[tool.ruff.lint.per-file-ignores]
# The exception name is part of the dukpt 1.0.1 API this module mirrors.
"src/pydukpt/compat.py" = ["N818"]
"tests/**" = ["N802", "N806"]
